name: Phase 8 Government Biz Validation

on:
  push:
    branches:
      - phase-8-government-biz
    paths:
      - "phase8-government-biz/**"
      - ".github/workflows/phase8-government-biz.yml"
  pull_request:
    paths:
      - "phase8-government-biz/**"
      - ".github/workflows/phase8-government-biz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase8-government-biz
    env:
      PHASE8_DRY_RUN: "true"
      PHASE8_ENABLE_CRM_WRITES: "false"
      PHASE8_ENABLE_NOTIFICATIONS: "false"
      PHASE8_OUTPUT_DIR: out
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase8-government-biz/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile package
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run isolated pipeline dry run
        run: python run_pipeline.py --mode test --limit-per-source 10

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-validation-${{ github.run_id }}
          path: phase8-government-biz/out/
          if-no-files-found: warn
          retention-days: 14
