name: Enrich CRM Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Enrich CRM
        env:
          ZOHO_ACCESS_TOKEN: ${{ secrets.ZOHO_ACCESS_TOKEN }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: python enrich_crm_script.py --mode apply --max-updates 100
      - name: Upload FACTURA audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factura-vendor-enrichment-audit
          path: |
            factura_enrichment_report.json
            factura_enrichment_audit.jsonl
            factura_zoho_schema.json
          if-no-files-found: warn
          retention-days: 30
