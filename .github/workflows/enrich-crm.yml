name: Enrich CRM Data

on:
  workflow_dispatch:
  push:
    branches:
      - crm-import-secure-20260618
    paths:
      - automation/execute-import.marker

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Enrich CRM
        env:
          ZOHO_ACCESS_TOKEN: ${{ secrets.ZOHO_ACCESS_TOKEN }}
        run: python enrich_crm_script.py
      - name: Record result
        if: always()
        run: |
          git config user.name "secure-supplies-crm-bot"
          git config user.email "procurement@securesupplies.us"
          git add zoho_*_result.json zoho_*_audit.csv 2>/dev/null || true
          git commit -m "Record authorized Zoho CRM execution result" || true
          git push origin HEAD:${GITHUB_REF_NAME}
