name: Enrich CRM Data

on:
  workflow_dispatch:
  push:
    branches:
      - crm-import-secure-20260618
    paths:
      - automation/execute-import.marker

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Enrich CRM
        env:
          ZOHO_ACCESS_TOKEN: ${{ secrets.ZOHO_ACCESS_TOKEN }}
        run: python enrich_crm_script.py
