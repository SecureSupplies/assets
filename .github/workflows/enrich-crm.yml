name: Enrich CRM Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '23 19 * * *'
  push:
    branches:
      - master
    paths:
      - enrich_crm_script.py
      - factura_verified_enrichments.json
      - .github/workflows/enrich-crm.yml

permissions:
  contents: write

concurrency:
  group: factura-vendor-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZOHO_ACCESS_TOKEN: ${{ secrets.ZOHO_ACCESS_TOKEN }}
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_CLIENT_SECRET_VALUE: ${{ secrets.ZOHO_CLIENT_SECRET_VALUE }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      ZOHO_REFRESH_TOKEN_VALUE: ${{ secrets.ZOHO_REFRESH_TOKEN_VALUE }}
      ZOHO_ACCOUNTS_DOMAIN: ${{ vars.ZOHO_ACCOUNTS_DOMAIN || 'https://accounts.zoho.com' }}
      ZOHO_API_DOMAIN: ${{ vars.ZOHO_API_DOMAIN || 'https://www.zohoapis.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check 'requests>=2.32'

      - name: Validate updater
        run: |
          python -m py_compile enrich_crm_script.py
          python enrich_crm_script.py --self-test

      - name: Audit before applying
        run: python enrich_crm_script.py --mode audit --max-updates 100

      - name: Enforce audit safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('factura_enrichment_report.json').read_text())
          counters = report.get('counters') or {}
          assert report.get('status') == 'completed', report
          assert report.get('staged_vendors') == 17, report
          assert report.get('matched_vendors', 0) > 0, report
          assert report.get('records_prepared', 0) <= 17, report
          assert counters.get('ambiguous', 0) == 0, report
          print(json.dumps({
              'matched_vendors': report.get('matched_vendors'),
              'records_prepared': report.get('records_prepared'),
              'fields_prepared': counters.get('fields', 0),
              'already_current': counters.get('already_current', 0),
          }, indent=2))
          PY

      - name: Apply verified Vendor Contacts updates
        run: python enrich_crm_script.py --mode apply --max-updates 100

      - name: Publish execution summary
        if: always()
        run: |
          if [ -f factura_enrichment_report.json ]; then
            echo '## FACTURA Vendor Enrichment' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('factura_enrichment_report.json').read_text())
          a = r.get('apply_result') or {}
          print(f"- Status: **{r.get('status')}**")
          print(f"- Records scanned: **{r.get('records_scanned', 0)}**")
          print(f"- Vendors matched: **{r.get('matched_vendors', 0)}**")
          print(f"- Records submitted: **{a.get('submitted', 0)}**")
          print(f"- Successful updates: **{a.get('success', 0)}**")
          print(f"- Failed updates: **{a.get('failed', 0)}**")
          PY
          fi

      - name: Write redacted operational status
        if: always()
        env:
          FACTURA_RUN_ID: ${{ github.run_id }}
          FACTURA_EVENT: ${{ github.event_name }}
          FACTURA_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('factura_enrichment_report.json')
          status_path = Path('factura_execution_status.json')
          report = json.loads(report_path.read_text()) if report_path.exists() else {}
          previous = json.loads(status_path.read_text()) if status_path.exists() else {}
          applied = report.get('apply_result') or {}
          stable = {
              'workflow_commit': os.getenv('FACTURA_COMMIT'),
              'cadence_utc': 'every 3 hours at minute 17 plus daily at 19:23',
              'status': report.get('status', 'report_missing'),
              'mode': report.get('mode'),
              'records_scanned': report.get('records_scanned', 0),
              'staged_vendors': report.get('staged_vendors', 0),
              'matched_vendors': report.get('matched_vendors', 0),
              'records_prepared': report.get('records_prepared', 0),
              'submitted': applied.get('submitted', 0),
              'successful': applied.get('success', 0),
              'failed': applied.get('failed', 0),
              'counters': report.get('counters', {}),
              'error': str(report.get('error', ''))[:500],
          }
          unchanged = all(previous.get(key) == value for key, value in stable.items())
          if unchanged:
              status = previous
          else:
              status = {
                  **stable,
                  'state_changed_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
                  'workflow_run_id': os.getenv('FACTURA_RUN_ID'),
                  'event': os.getenv('FACTURA_EVENT'),
              }
          status_path.write_text(json.dumps(status, indent=2) + '\n')
          PY

      - name: Persist operational status changes
        if: always()
        run: |
          git config user.name 'factura-enrichment-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add factura_execution_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FACTURA enrichment state change'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Upload FACTURA audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factura-vendor-enrichment-audit-${{ github.run_id }}
          path: |
            factura_enrichment_report.json
            factura_enrichment_audit.jsonl
            factura_zoho_schema.json
            factura_execution_status.json
          if-no-files-found: warn
          retention-days: 30
