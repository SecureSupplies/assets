name: Secure Zoho CRM Import

on:
  workflow_dispatch:
  push:
    branches:
      - crm-import-secure-20260618
    paths:
      - automation/execute-import.marker

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pynacl
      - name: Run secured Zoho operation
        env:
          ZOHO_ACCESS_TOKEN: ${{ secrets.ZOHO_ACCESS_TOKEN }}
        run: python enrich_crm_script.py
      - name: Record non-secret result
        if: always()
        run: |
          git config user.name "secure-supplies-crm-bot"
          git config user.email "procurement@securesupplies.us"
          git add zoho_preflight_result.json zoho_import_result.json zoho_import_public.key zoho_import_audit.enc 2>/dev/null || true
          git commit -m "Record secured Zoho CRM execution result" || true
          git push origin HEAD:${GITHUB_REF_NAME}
